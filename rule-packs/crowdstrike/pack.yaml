  - id: CS-007
    name: "Connection to a common C2 port"
    description: "A system binary connected out to a port typical of reverse shells and C2 frameworks."
    severity: 3
    tactic: "TA0011"
    technique: "T1571"
    table: "NETWORK_TRAFFIC"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "crowdstrike", "body": {"ComputerName": "WS-{{entity}}", "UserName": "{{entity}}", "event_platform": "Win", "aid": "aid-1", "event_simpleName": "NetworkConnectIP4", "LocalAddressIP4": "10.0.0.5", "LocalPort": "50123", "RemoteAddressIP4": "203.0.113.66", "RemotePort": "4444", "Protocol": "6", "ContextBaseFileName": "rundll32.exe"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "crowdstrike", "body": {"ComputerName": "WS-{{entity}}", "UserName": "{{entity}}", "event_platform": "Win", "aid": "aid-1", "event_simpleName": "NetworkConnectIP4", "LocalAddressIP4": "10.0.0.5", "LocalPort": "50123", "RemoteAddressIP4": "203.0.113.66", "RemotePort": "443", "Protocol": "6", "ContextBaseFileName": "rundll32.exe"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, src AS user_name, src, dest, app || ' -> ' || dest_ip || ':' || dest_port AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.NETWORK_TRAFFIC
      WHERE vendor_product = 'CrowdStrike Falcon' AND (direction = 'outbound' OR direction = 'outgoing') AND dest_port IN (4444, 1337, 8443, 50050, 31337) AND app IN ('rundll32.exe', 'regsvr32.exe', 'powershell.exe', 'mshta.exe', 'cmd.exe')

  - id: CS-008
    name: "DNS to a tunnelling or dynamic-DNS service"
    description: "A host resolved an ngrok, trycloudflare or dynamic-DNS name often used for C2 and exfiltration."
    severity: 3
    tactic: "TA0011"
    technique: "T1572"
    table: "DNS_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "crowdstrike", "body": {"ComputerName": "WS-{{entity}}", "UserName": "{{entity}}", "event_platform": "Win", "aid": "aid-1", "event_simpleName": "DnsRequest", "DomainName": "a1b2.ngrok-free.app", "RequestType": "1", "ContextBaseFileName": "powershell.exe"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "crowdstrike", "body": {"ComputerName": "WS-{{entity}}", "UserName": "{{entity}}", "event_platform": "Win", "aid": "aid-1", "event_simpleName": "DnsRequest", "DomainName": "login.microsoftonline.com", "RequestType": "1", "ContextBaseFileName": "powershell.exe"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, src AS user_name, src, dest, query AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DNS_ACTIVITY
      WHERE vendor_product = 'CrowdStrike Falcon' AND REGEXP_LIKE(query, '.*\\.(ngrok\\.io|ngrok-free\\.app|trycloudflare\\.com|duckdns\\.org|no-ip\\.org|serveo\\.net)$', 'i')

  - id: CS-009
    name: "Executable dropped in a Startup folder"
    description: "A program, script or shortcut was written to a Startup folder so it runs at every logon."
    severity: 4
    tactic: "TA0003"
    technique: "T1547.001"
    table: "ENDPOINT_FILESYSTEM"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "crowdstrike", "body": {"ComputerName": "WS-{{entity}}", "UserName": "{{entity}}", "event_platform": "Win", "aid": "aid-1", "event_simpleName": "NewExecutableWritten", "TargetFileName": "\\Device\\HarddiskVolume3\\Users\\x\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\upd.exe", "ContextBaseFileName": "powershell.exe"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "crowdstrike", "body": {"ComputerName": "WS-{{entity}}", "UserName": "{{entity}}", "event_platform": "Win", "aid": "aid-1", "event_simpleName": "NewExecutableWritten", "TargetFileName": "\\Device\\HarddiskVolume3\\Users\\x\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\notes.txt", "ContextBaseFileName": "powershell.exe"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, process_name AS src, dest, file_path AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.ENDPOINT_FILESYSTEM
      WHERE vendor_product = 'CrowdStrike Falcon' AND CONTAINS(LOWER(file_path), '\\start menu\\programs\\startup\\') AND REGEXP_LIKE(file_path, '.*\\.(exe|lnk|bat|cmd|vbs|js|ps1|hta)$', 'i')

