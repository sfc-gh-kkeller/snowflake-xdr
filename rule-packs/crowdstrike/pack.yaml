    severity: 5
    tactic: "TA0040"
    technique: "T1490"
    table: "ENDPOINT_PROCESSES"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "crowdstrike", "body": {"ComputerName": "WS-{{entity}}", "UserName": "{{entity}}", "event_platform": "Win", "aid": "aid-1", "event_simpleName": "ProcessRollup2", "ImageFileName": "\\Device\\HarddiskVolume3\\Windows\\System32\\vssadmin.exe", "CommandLine": "vssadmin.exe delete shadows /all /quiet", "ParentBaseFileName": "explorer.exe", "TargetProcessId": "4242"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "crowdstrike", "body": {"ComputerName": "WS-{{entity}}", "UserName": "{{entity}}", "event_platform": "Win", "aid": "aid-1", "event_simpleName": "ProcessRollup2", "ImageFileName": "\\Device\\HarddiskVolume3\\Windows\\System32\\vssadmin.exe", "CommandLine": "vssadmin.exe list shadows", "ParentBaseFileName": "explorer.exe", "TargetProcessId": "4242"}}, "count": 1, "offset_minutes": 1}]}
