      WHERE vendor_product = 'CrowdStrike Falcon' AND ((process_name = 'vssadmin.exe' AND process ILIKE '%delete%shadows%') OR (process_name = 'wmic.exe' AND process ILIKE '%shadowcopy%delete%') OR (process_name = 'wbadmin.exe' AND process ILIKE '%delete%catalog%'))

