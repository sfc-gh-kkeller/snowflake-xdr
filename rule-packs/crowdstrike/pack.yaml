pack_id: crowdstrike
name: CrowdStrike Falcon
vendor: CrowdStrike
version: 1
description: "CrowdStrike Falcon detections: native high-severity alerts plus behavioural rules (macro droppers, encoded PowerShell, LSASS dumps, recovery deletion, LOLBin downloads, C2 ports, tunnelling DNS, Startup persistence). The Sigma endpoint pack runs on the same data."
requires: [{"table": "ENDPOINT_PROCESSES", "vendor_product": "CrowdStrike Falcon"}]
onboarding: "Stream Falcon Data Replicator (FDR) and Event Streams with otel-receiver/collector-examples/crowdstrike_fdr.py (service.name crowdstrike)."
rules:
  - id: CS-001
    name: "CrowdStrike Falcon: high-severity native detection"
    description: "The EDR raised a high or critical detection; correlated with every other source."
    severity: 4
    tactic: "TA0002"
    technique: "T1204"
    table: "INTRUSION_DETECTION"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "crowdstrike", "body": {"metadata": {"eventType": "DetectionSummaryEvent"}, "event": {"ComputerName": "WS-{{entity}}", "UserName": "{{entity}}", "Severity": 5, "DetectName": "Credential Theft", "Description": "lsass dump", "Tactic": "Credential Access", "Technique": "OS Credential Dumping", "LocalIP": "10.0.0.5"}}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "crowdstrike", "body": {"metadata": {"eventType": "DetectionSummaryEvent"}, "event": {"ComputerName": "WS-{{entity}}", "UserName": "{{entity}}", "Severity": 2, "DetectName": "PUA", "Description": "adware", "Tactic": "Credential Access", "Technique": "OS Credential Dumping", "LocalIP": "10.0.0.5"}}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, dest AS user_name, src, src AS dest, signature AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.INTRUSION_DETECTION
      WHERE vendor_product = 'CrowdStrike Falcon' AND severity >= 4

  - id: CS-002
    name: "Office application spawned a shell"
    description: "Word, Excel, PowerPoint or Outlook started cmd, PowerShell or a script host: the classic macro dropper."
    severity: 4
    tactic: "TA0001"
    technique: "T1566.001"
    table: "ENDPOINT_PROCESSES"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "crowdstrike", "body": {"ComputerName": "WS-{{entity}}", "UserName": "{{entity}}", "event_platform": "Win", "aid": "aid-1", "event_simpleName": "ProcessRollup2", "ImageFileName": "\\Device\\HarddiskVolume3\\Windows\\System32\\cmd.exe", "CommandLine": "cmd.exe /c whoami", "ParentBaseFileName": "WINWORD.EXE", "TargetProcessId": "4242"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "crowdstrike", "body": {"ComputerName": "WS-{{entity}}", "UserName": "{{entity}}", "event_platform": "Win", "aid": "aid-1", "event_simpleName": "ProcessRollup2", "ImageFileName": "\\Device\\HarddiskVolume3\\Windows\\System32\\cmd.exe", "CommandLine": "cmd.exe /c whoami", "ParentBaseFileName": "explorer.exe", "TargetProcessId": "4242"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, process_name AS src, dest, process_name || ' on ' || dest || ': ' || LEFT(process, 200) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.ENDPOINT_PROCESSES
      WHERE vendor_product = 'CrowdStrike Falcon' AND (parent_process_name IN ('winword.exe', 'excel.exe', 'powerpnt.exe', 'outlook.exe') AND process_name IN ('cmd.exe', 'powershell.exe', 'pwsh.exe', 'wscript.exe', 'cscript.exe', 'mshta.exe'))

  - id: CS-003
    name: "Encoded PowerShell command"
    description: "PowerShell started with an encoded command, used to hide payloads."
    severity: 3
    tactic: "TA0002"
    technique: "T1059.001"
    table: "ENDPOINT_PROCESSES"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "crowdstrike", "body": {"ComputerName": "WS-{{entity}}", "UserName": "{{entity}}", "event_platform": "Win", "aid": "aid-1", "event_simpleName": "ProcessRollup2", "ImageFileName": "\\Device\\HarddiskVolume3\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe", "CommandLine": "powershell.exe -nop -w hidden -enc SQBFAFgA", "ParentBaseFileName": "explorer.exe", "TargetProcessId": "4242"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "crowdstrike", "body": {"ComputerName": "WS-{{entity}}", "UserName": "{{entity}}", "event_platform": "Win", "aid": "aid-1", "event_simpleName": "ProcessRollup2", "ImageFileName": "\\Device\\HarddiskVolume3\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe", "CommandLine": "powershell.exe -File C:\\scripts\\backup.ps1", "ParentBaseFileName": "explorer.exe", "TargetProcessId": "4242"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, process_name AS src, dest, process_name || ' on ' || dest || ': ' || LEFT(process, 200) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.ENDPOINT_PROCESSES
      WHERE vendor_product = 'CrowdStrike Falcon' AND (process_name IN ('powershell.exe', 'pwsh.exe') AND REGEXP_LIKE(process, '.*\\s-(e|en|enc|enco|encodedcommand)\\s.*', 'i'))

  - id: CS-004
    name: "LSASS memory dump"
    description: "comsvcs.dll MiniDump or procdump against lsass: credential theft."
    severity: 5
    tactic: "TA0006"
    technique: "T1003.001"
    table: "ENDPOINT_PROCESSES"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "crowdstrike", "body": {"ComputerName": "WS-{{entity}}", "UserName": "{{entity}}", "event_platform": "Win", "aid": "aid-1", "event_simpleName": "ProcessRollup2", "ImageFileName": "\\Device\\HarddiskVolume3\\Windows\\System32\\rundll32.exe", "CommandLine": "rundll32.exe C:\\windows\\System32\\comsvcs.dll, MiniDump 624 C:\\temp\\l.dmp full", "ParentBaseFileName": "explorer.exe", "TargetProcessId": "4242"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "crowdstrike", "body": {"ComputerName": "WS-{{entity}}", "UserName": "{{entity}}", "event_platform": "Win", "aid": "aid-1", "event_simpleName": "ProcessRollup2", "ImageFileName": "\\Device\\HarddiskVolume3\\Windows\\System32\\rundll32.exe", "CommandLine": "rundll32.exe shell32.dll,Control_RunDLL", "ParentBaseFileName": "explorer.exe", "TargetProcessId": "4242"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, process_name AS src, dest, process_name || ' on ' || dest || ': ' || LEFT(process, 200) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.ENDPOINT_PROCESSES
      WHERE vendor_product = 'CrowdStrike Falcon' AND ((process ILIKE '%comsvcs%' AND process ILIKE '%minidump%') OR (process_name IN ('procdump.exe', 'procdump64.exe') AND process ILIKE '%lsass%'))

  - id: CS-005
