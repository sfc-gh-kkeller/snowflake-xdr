# Generated by scripts/gen_rule_packs.py - edit there, then re-run it.
pack_id: entra
name: Microsoft Entra ID and Azure
vendor: Microsoft
version: 1
description: "Entra ID sign-in and audit detections (risky and legacy sign-ins, spray, MFA fatigue, privileged roles, app credentials, consent, Conditional Access and federation tampering) plus Azure control-plane abuse (Owner assignments, diagnostic settings, VM run command)."
requires: [{"table": "AUTHENTICATION", "vendor_product": "Entra ID"}, {"table": "CLOUD_API", "vendor_product": "Entra ID"}, {"table": "CLOUD_API", "vendor_product": "azure"}]
onboarding: "Export SignInLogs, AuditLogs and the Activity log to Event Hubs and ship them with otel-receiver/collector-examples/entra_azure_forwarder.py, which routes them to service.name entra_signin, entra_audit, azure_activity."
rules:
  - id: ENT-001
    name: "Risky sign-in succeeded"
    description: "Successful sign-in that Entra ID Protection rated medium or high risk."
    severity: 4
    tactic: "TA0001"
    technique: "T1078.004"
    table: "AUTHENTICATION"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "entra_signin", "body": {"category": "SignInLogs", "tenantId": "tenant-1", "properties": {"userPrincipalName": "{{entity}}@contoso.com", "ipAddress": "198.51.100.40", "appDisplayName": "Office 365", "clientAppUsed": "Browser", "status": {"errorCode": 0, "failureReason": null}, "location": {"countryOrRegion": "DE", "city": "Berlin"}, "riskLevelDuringSignIn": "high", "authenticationRequirement": "singleFactorAuthentication", "resourceDisplayName": "Office 365"}}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "entra_signin", "body": {"category": "SignInLogs", "tenantId": "tenant-1", "properties": {"userPrincipalName": "{{entity}}@contoso.com", "ipAddress": "198.51.100.40", "appDisplayName": "Office 365", "clientAppUsed": "Browser", "status": {"errorCode": 0, "failureReason": null}, "location": {"countryOrRegion": "DE", "city": "Berlin"}, "riskLevelDuringSignIn": "low", "authenticationRequirement": "singleFactorAuthentication", "resourceDisplayName": "Office 365"}}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'Risky sign-in (' || signature || ') to ' || COALESCE(app, '?') AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.AUTHENTICATION
      WHERE vendor_product = 'Entra ID' AND (action = 'success' AND _raw:properties:riskLevelDuringSignIn::VARCHAR IN ('medium', 'high'))

  - id: ENT-002
    name: "Legacy authentication sign-in"
    description: "Successful sign-in over a legacy protocol that cannot do MFA (IMAP, POP, SMTP, ActiveSync, other clients)."
    severity: 3
    tactic: "TA0001"
    technique: "T1078"
    table: "AUTHENTICATION"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    false_positives: "Old multifunction printers and mail clients."
    fixtures: {"positive": [{"otel": {"service_name": "entra_signin", "body": {"category": "SignInLogs", "tenantId": "tenant-1", "properties": {"userPrincipalName": "{{entity}}@contoso.com", "ipAddress": "198.51.100.40", "appDisplayName": "Office 365", "clientAppUsed": "IMAP4", "status": {"errorCode": 0, "failureReason": null}, "location": {"countryOrRegion": "DE", "city": "Berlin"}, "riskLevelDuringSignIn": "none", "authenticationRequirement": "singleFactorAuthentication", "resourceDisplayName": "Office 365"}}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "entra_signin", "body": {"category": "SignInLogs", "tenantId": "tenant-1", "properties": {"userPrincipalName": "{{entity}}@contoso.com", "ipAddress": "198.51.100.40", "appDisplayName": "Office 365", "clientAppUsed": "Browser", "status": {"errorCode": 0, "failureReason": null}, "location": {"countryOrRegion": "DE", "city": "Berlin"}, "riskLevelDuringSignIn": "none", "authenticationRequirement": "singleFactorAuthentication", "resourceDisplayName": "Office 365"}}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'Legacy auth via ' || user_agent AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.AUTHENTICATION
      WHERE vendor_product = 'Entra ID' AND (action = 'success' AND user_agent IN ('IMAP4', 'POP3', 'Authenticated SMTP', 'Exchange ActiveSync', 'Other clients', 'Exchange Web Services', 'MAPI Over HTTP'))

  - id: ENT-003
    name: "Entra password spray"
    description: "One source fails sign-in (50126 invalid credentials) for ten or more users in 30 minutes."
    severity: 4
    tactic: "TA0006"
    technique: "T1110.003"
    table: "AUTHENTICATION"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "entra_signin", "body": {"category": "SignInLogs", "tenantId": "tenant-1", "properties": {"userPrincipalName": "spray{{n}}@contoso.com", "ipAddress": "{{entity}}", "appDisplayName": "Office 365", "clientAppUsed": "Browser", "status": {"errorCode": 50126, "failureReason": "error 50126"}, "location": {"countryOrRegion": "DE", "city": "Berlin"}, "riskLevelDuringSignIn": "none", "authenticationRequirement": "singleFactorAuthentication", "resourceDisplayName": "Office 365"}}}, "count": 12, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "entra_signin", "body": {"category": "SignInLogs", "tenantId": "tenant-1", "properties": {"userPrincipalName": "spray{{n}}@contoso.com", "ipAddress": "{{entity}}", "appDisplayName": "Office 365", "clientAppUsed": "Browser", "status": {"errorCode": 50126, "failureReason": "error 50126"}, "location": {"countryOrRegion": "DE", "city": "Berlin"}, "riskLevelDuringSignIn": "none", "authenticationRequirement": "singleFactorAuthentication", "resourceDisplayName": "Office 365"}}}, "count": 3, "offset_minutes": 1}]}
    sql: |
      SELECT MAX(_time) AS _time, NULL AS user_name, src, MAX(dest) AS dest,
             'Password spray from ' || src || ' against ' || COUNT(DISTINCT user_name) || ' users' AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.AUTHENTICATION
      WHERE vendor_product = 'Entra ID' AND action = 'failure' AND signature_id = '50126'
        AND _time > DATEADD('minute', -240, CURRENT_TIMESTAMP())
      GROUP BY src, TIME_SLICE(_time::TIMESTAMP_NTZ, 30, 'MINUTE')
      HAVING COUNT(DISTINCT user_name) >= 10

  - id: ENT-004
    name: "MFA fatigue"
    description: "Five or more MFA denials (500121) for one user in 15 minutes."
    severity: 4
    tactic: "TA0006"
    technique: "T1621"
    table: "AUTHENTICATION"
    threshold: 5
    window_minutes: 15
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "entra_signin", "body": {"category": "SignInLogs", "tenantId": "tenant-1", "properties": {"userPrincipalName": "{{entity}}@contoso.com", "ipAddress": "198.51.100.40", "appDisplayName": "Office 365", "clientAppUsed": "Browser", "status": {"errorCode": 500121, "failureReason": "error 500121"}, "location": {"countryOrRegion": "DE", "city": "Berlin"}, "riskLevelDuringSignIn": "none", "authenticationRequirement": "singleFactorAuthentication", "resourceDisplayName": "Office 365"}}}, "count": 5, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "entra_signin", "body": {"category": "SignInLogs", "tenantId": "tenant-1", "properties": {"userPrincipalName": "{{entity}}@contoso.com", "ipAddress": "198.51.100.40", "appDisplayName": "Office 365", "clientAppUsed": "Browser", "status": {"errorCode": 500121, "failureReason": "error 500121"}, "location": {"countryOrRegion": "DE", "city": "Berlin"}, "riskLevelDuringSignIn": "none", "authenticationRequirement": "singleFactorAuthentication", "resourceDisplayName": "Office 365"}}}, "count": 2, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'MFA denied: ' || COALESCE(reason, '') AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.AUTHENTICATION
      WHERE vendor_product = 'Entra ID' AND (action = 'failure' AND signature_id = '500121')

