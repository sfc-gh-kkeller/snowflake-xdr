# Generated by scripts/gen_rule_packs.py - edit there, then re-run it.
pack_id: okta
name: Okta Identity
vendor: Okta
version: 1
description: "Okta System Log detections: MFA factor tampering, admin privilege grants, API tokens, policy weakening, push fatigue, brute force, new-country sessions, ThreatInsight, IdP changes, impersonation."
requires: [{"table": "AUTHENTICATION", "vendor_product": "Okta"}, {"table": "CLOUD_API", "vendor_product": "Okta"}]
onboarding: "Run otel-receiver/collector-examples/okta_forwarder.py (polls /api/v1/logs) with service.name okta."
rules:
  - id: OKTA-001
    name: "MFA factor reset or removed"
    description: "A user's MFA factors were deactivated or reset: attackers re-enrol their own factor."
    severity: 3
    tactic: "TA0003"
    technique: "T1556.006"
    table: "CLOUD_API"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    false_positives: "Help-desk resets for lost phones."
    fixtures: {"positive": [{"otel": {"service_name": "okta", "body": {"eventType": "user.mfa.factor.reset_all", "displayMessage": "user.mfa.factor.reset_all", "actor": {"alternateId": "{{entity}}@corp.example", "type": "User", "id": "00u1"}, "client": {"ipAddress": "198.51.100.50", "geographicalContext": {"country": "United States", "city": "X"}, "userAgent": {"rawUserAgent": "Mozilla/5.0"}}, "outcome": {"result": "SUCCESS", "reason": null}, "authenticationContext": {"credentialType": "PASSWORD"}, "target": [{"alternateId": "victim@corp.example", "displayName": "victim", "type": "User"}]}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "okta", "body": {"eventType": "user.mfa.factor.activate", "displayMessage": "user.mfa.factor.activate", "actor": {"alternateId": "{{entity}}@corp.example", "type": "User", "id": "00u1"}, "client": {"ipAddress": "198.51.100.50", "geographicalContext": {"country": "United States", "city": "X"}, "userAgent": {"rawUserAgent": "Mozilla/5.0"}}, "outcome": {"result": "SUCCESS", "reason": null}, "authenticationContext": {"credentialType": "PASSWORD"}, "target": [{"alternateId": "victim@corp.example", "displayName": "victim", "type": "User"}]}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, action || ' for ' || COALESCE(object, '?') || ' by ' || user_name AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.CLOUD_API
      WHERE vendor_product = 'Okta' AND (result = 'success' AND action IN ('user.mfa.factor.deactivate', 'user.mfa.factor.reset_all'))

