  - id: OKTA-007
    name: "Okta session from a new country"
    description: "Successful sign-in from a country the user has not signed in from in 30 days."
    severity: 3
    tactic: "TA0001"
    technique: "T1078.004"
    table: "AUTHENTICATION"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    false_positives: "Travel."
    fixtures: {"positive": [{"otel": {"service_name": "okta", "body": {"eventType": "user.session.start", "displayMessage": "user.session.start", "actor": {"alternateId": "{{entity}}@corp.example", "type": "User", "id": "00u1"}, "client": {"ipAddress": "198.51.100.50", "geographicalContext": {"country": "United States", "city": "X"}, "userAgent": {"rawUserAgent": "Mozilla/5.0"}}, "outcome": {"result": "SUCCESS", "reason": null}, "authenticationContext": {"credentialType": "PASSWORD"}, "target": [{"alternateId": "victim@corp.example", "displayName": "victim", "type": "User"}]}}, "count": 1, "offset_minutes": 7200}, {"otel": {"service_name": "okta", "body": {"eventType": "user.session.start", "displayMessage": "user.session.start", "actor": {"alternateId": "{{entity}}@corp.example", "type": "User", "id": "00u1"}, "client": {"ipAddress": "198.51.100.50", "geographicalContext": {"country": "Nigeria", "city": "X"}, "userAgent": {"rawUserAgent": "Mozilla/5.0"}}, "outcome": {"result": "SUCCESS", "reason": null}, "authenticationContext": {"credentialType": "PASSWORD"}, "target": [{"alternateId": "victim@corp.example", "displayName": "victim", "type": "User"}]}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "okta", "body": {"eventType": "user.session.start", "displayMessage": "user.session.start", "actor": {"alternateId": "{{entity}}@corp.example", "type": "User", "id": "00u1"}, "client": {"ipAddress": "198.51.100.50", "geographicalContext": {"country": "United States", "city": "X"}, "userAgent": {"rawUserAgent": "Mozilla/5.0"}}, "outcome": {"result": "SUCCESS", "reason": null}, "authenticationContext": {"credentialType": "PASSWORD"}, "target": [{"alternateId": "victim@corp.example", "displayName": "victim", "type": "User"}]}}, "count": 1, "offset_minutes": 7200}, {"otel": {"service_name": "okta", "body": {"eventType": "user.session.start", "displayMessage": "user.session.start", "actor": {"alternateId": "{{entity}}@corp.example", "type": "User", "id": "00u1"}, "client": {"ipAddress": "198.51.100.50", "geographicalContext": {"country": "United States", "city": "X"}, "userAgent": {"rawUserAgent": "Mozilla/5.0"}}, "outcome": {"result": "SUCCESS", "reason": null}, "authenticationContext": {"credentialType": "PASSWORD"}, "target": [{"alternateId": "victim@corp.example", "displayName": "victim", "type": "User"}]}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT n._time, n.user_name, n.src, n.dest,
             'Okta sign-in from new country ' || n.geo_country AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.AUTHENTICATION n
      WHERE n.vendor_product = 'Okta' AND n.action = 'success' AND n.geo_country IS NOT NULL
        AND n._time > DATEADD('minute', -240, CURRENT_TIMESTAMP())
        AND EXISTS (SELECT 1 FROM SNOWFLAKE_XDR.RAW_LOGS.AUTHENTICATION h WHERE h.vendor_product = 'Okta'
                    AND h.user_name = n.user_name AND h.action = 'success'
                    AND h._time BETWEEN DATEADD('day', -30, n._time) AND DATEADD('day', -1, n._time))
        AND NOT EXISTS (SELECT 1 FROM SNOWFLAKE_XDR.RAW_LOGS.AUTHENTICATION h WHERE h.vendor_product = 'Okta'
                    AND h.user_name = n.user_name AND h.action = 'success' AND h.geo_country = n.geo_country
                    AND h._time BETWEEN DATEADD('day', -30, n._time) AND DATEADD('minute', -240, CURRENT_TIMESTAMP()))

