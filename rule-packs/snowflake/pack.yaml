  - id: SF-017
    name: Credential added to a user
    description: A programmatic access token, RSA key or OAuth client secret was added for a user.
    severity: 3
    tactic: TA0003
    technique: T1098.001
    table: DATABASE_ACTIVITY
    false_positives: Service-account key rotation.
    fixtures: {"positive": [{"table": "DATABASE_ACTIVITY", "row": {"vendor_product": "snowflake", "dest": "CANARY_ACCT", "result": "success", "user_name": "{{entity}}", "query_type": "ALTER_USER", "action": "alter", "query_text": "ALTER USER svc_etl ADD PROGRAMMATIC ACCESS TOKEN backdoor_pat"}}], "negative": [{"table": "DATABASE_ACTIVITY", "row": {"vendor_product": "snowflake", "dest": "CANARY_ACCT", "result": "success", "user_name": "{{entity}}", "query_type": "ALTER_USER", "action": "alter", "query_text": "ALTER USER svc_etl SET COMMENT = 'etl service'"}}]}
    sql: |
      SELECT _time, user_name, src, dest,
             'Credential added by ' || user_name || ': ' || LEFT(REGEXP_REPLACE(query_text, '=[[:space:]]*[^[:space:]]{20,}', '= <redacted>'), 200) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'snowflake' AND result = 'success'
        AND REGEXP_LIKE(query_text, '.*(ADD[[:space:]]+(PROGRAMMATIC[[:space:]]+ACCESS[[:space:]]+TOKEN|PAT)|SET[[:space:]]+RSA_PUBLIC_KEY(_2)?[[:space:]]*=).*', 'is')

  - id: SF-018
    name: Dormant user signed in
    description: A user with no successful login in the previous 60 days signed in.
    severity: 3
    tactic: TA0001
    technique: T1078
    table: AUTHENTICATION
    fixtures: {"positive": [{"table": "AUTHENTICATION", "count": 1, "offset_minutes": 129600, "row": {"vendor_product": "snowflake", "app": "snowflake", "dest": "CANARY_ACCT", "user_name": "{{entity}}", "src": "198.51.100.7", "action": "success"}}, {"table": "AUTHENTICATION", "count": 1, "offset_minutes": 1, "row": {"vendor_product": "snowflake", "app": "snowflake", "dest": "CANARY_ACCT", "user_name": "{{entity}}", "src": "198.51.100.7", "action": "success"}}], "negative": [{"table": "AUTHENTICATION", "count": 1, "offset_minutes": 129600, "row": {"vendor_product": "snowflake", "app": "snowflake", "dest": "CANARY_ACCT", "user_name": "{{entity}}", "src": "198.51.100.7", "action": "success"}}, {"table": "AUTHENTICATION", "count": 1, "offset_minutes": 14400, "row": {"vendor_product": "snowflake", "app": "snowflake", "dest": "CANARY_ACCT", "user_name": "{{entity}}", "src": "198.51.100.7", "action": "success"}}, {"table": "AUTHENTICATION", "count": 1, "offset_minutes": 1, "row": {"vendor_product": "snowflake", "app": "snowflake", "dest": "CANARY_ACCT", "user_name": "{{entity}}", "src": "198.51.100.7", "action": "success"}}]}
    sql: |
      SELECT n._time, n.user_name, n.src, n.dest,
             'Dormant user signed in from ' || COALESCE(n.src, '?') AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.AUTHENTICATION n
      WHERE n.vendor_product = 'snowflake' AND n.action = 'success'
        AND n._time > DATEADD('minute', -240, CURRENT_TIMESTAMP())
        AND EXISTS (SELECT 1 FROM SNOWFLAKE_XDR.RAW_LOGS.AUTHENTICATION h
                    WHERE h.vendor_product = 'snowflake' AND h.user_name = n.user_name
                      AND h._time < DATEADD('day', -60, n._time))
        AND NOT EXISTS (SELECT 1 FROM SNOWFLAKE_XDR.RAW_LOGS.AUTHENTICATION h
                        WHERE h.vendor_product = 'snowflake' AND h.user_name = n.user_name AND h.action = 'success'
                          AND h._time BETWEEN DATEADD('day', -60, n._time) AND DATEADD('minute', -240, CURRENT_TIMESTAMP()))
