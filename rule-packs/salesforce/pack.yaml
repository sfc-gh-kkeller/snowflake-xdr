# Generated by scripts/gen_rule_packs.py - edit there, then re-run it.
pack_id: salesforce
name: Salesforce
vendor: Salesforce
version: 1
description: "Salesforce event monitoring and setup audit trail detections: mass report exports and API queries, login brute force, new-country logins, admin permission grants, connected-app changes, network and session security weakening, and login-as impersonation."
requires: [{"table": "DATABASE_ACTIVITY", "vendor_product": "salesforce"}]
onboarding: "Run otel-receiver/collector-examples/salesforce_forwarder.py (Real-Time Event Monitoring LoginEvent/ReportEvent/ApiEvent and SetupAuditTrail), service.name salesforce."
rules:
  - id: SFDC-001
    name: "Mass report export"
    description: "A report export of 10,000 rows or more."
    severity: 4
    tactic: "TA0009"
    technique: "T1213"
    table: "DATABASE_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    false_positives: "Finance month-end exports."
    fixtures: {"positive": [{"otel": {"service_name": "salesforce", "body": {"EventType": "ReportEvent", "Username": "{{entity}}@corp.example", "SourceIp": "198.51.100.70", "OrganizationId": "00D1", "Operation": "ReportExported", "RowsProcessed": 250000, "ReportId": "00O1"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "salesforce", "body": {"EventType": "ReportEvent", "Username": "{{entity}}@corp.example", "SourceIp": "198.51.100.70", "OrganizationId": "00D1", "Operation": "ReportExported", "RowsProcessed": 120, "ReportId": "00O1"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'Report ' || COALESCE(object, '?') || ' exported: ' || rows_affected || ' rows' AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'salesforce' AND (action = 'report' AND query_type IN ('ReportExported', 'ReportExportedAsync') AND rows_affected >= 10000)

  - id: SFDC-002
    name: "Mass API data pull"
    description: "An API or Bulk API query returned 100,000 rows or more."
    severity: 4
    tactic: "TA0009"
    technique: "T1213"
    table: "DATABASE_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    false_positives: "Integration users syncing to a warehouse."
    fixtures: {"positive": [{"otel": {"service_name": "salesforce", "body": {"EventType": "ApiEvent", "Username": "{{entity}}@corp.example", "SourceIp": "198.51.100.70", "OrganizationId": "00D1", "Operation": "Query", "RowsProcessed": 500000, "Query": "SELECT Id, Email FROM Contact"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "salesforce", "body": {"EventType": "ApiEvent", "Username": "{{entity}}@corp.example", "SourceIp": "198.51.100.70", "OrganizationId": "00D1", "Operation": "Query", "RowsProcessed": 50, "Query": "SELECT Id FROM Account LIMIT 50"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'API pull of ' || rows_affected || ' rows: ' || LEFT(COALESCE(query_text, ''), 150) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'salesforce' AND (action IN ('api', 'bulk_api') AND rows_affected >= 100000)

  - id: SFDC-003
    name: "Salesforce login brute force"
    description: "Ten or more failed logins for one user from one source in 15 minutes."
    severity: 3
    tactic: "TA0006"
    technique: "T1110"
    table: "DATABASE_ACTIVITY"
    threshold: 10
    window_minutes: 15
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "salesforce", "body": {"EventType": "LoginEvent", "Username": "{{entity}}@corp.example", "SourceIp": "198.51.100.70", "OrganizationId": "00D1", "Status": "Invalid Password", "LoginType": "Application"}}, "count": 10, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "salesforce", "body": {"EventType": "LoginEvent", "Username": "{{entity}}@corp.example", "SourceIp": "198.51.100.70", "OrganizationId": "00D1", "Status": "Invalid Password", "LoginType": "Application"}}, "count": 2, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'Login failed: ' || COALESCE(reason, '') AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'salesforce' AND (action = 'login' AND result = 'failure')

  - id: SFDC-004
    name: "Salesforce login from a new country"
    description: "Successful login from a country the user has not logged in from in 30 days."
    severity: 2
    tactic: "TA0001"
    technique: "T1078.004"
    table: "DATABASE_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    false_positives: "Travel."
    fixtures: {"positive": [{"otel": {"service_name": "salesforce", "body": {"EventType": "LoginEvent", "Username": "{{entity}}@corp.example", "SourceIp": "198.51.100.70", "OrganizationId": "00D1", "Status": "Success", "Country": "Germany"}}, "count": 1, "offset_minutes": 7200}, {"otel": {"service_name": "salesforce", "body": {"EventType": "LoginEvent", "Username": "{{entity}}@corp.example", "SourceIp": "198.51.100.70", "OrganizationId": "00D1", "Status": "Success", "Country": "Brazil"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "salesforce", "body": {"EventType": "LoginEvent", "Username": "{{entity}}@corp.example", "SourceIp": "198.51.100.70", "OrganizationId": "00D1", "Status": "Success", "Country": "Germany"}}, "count": 1, "offset_minutes": 7200}, {"otel": {"service_name": "salesforce", "body": {"EventType": "LoginEvent", "Username": "{{entity}}@corp.example", "SourceIp": "198.51.100.70", "OrganizationId": "00D1", "Status": "Success", "Country": "Germany"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT n._time, n.user_name, n.src, n.dest, 'Login from new country ' || n._raw:Country::VARCHAR AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY n
      WHERE n.vendor_product = 'salesforce' AND n.action = 'login' AND n.result = 'success'
        AND n._raw:Country IS NOT NULL AND n._time > DATEADD('minute', -240, CURRENT_TIMESTAMP())
        AND EXISTS (SELECT 1 FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY h WHERE h.vendor_product = 'salesforce'
                    AND h.action = 'login' AND h.result = 'success' AND h.user_name = n.user_name
                    AND h._time BETWEEN DATEADD('day', -30, n._time) AND DATEADD('day', -1, n._time))
        AND NOT EXISTS (SELECT 1 FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY h WHERE h.vendor_product = 'salesforce'
                    AND h.action = 'login' AND h.result = 'success' AND h.user_name = n.user_name
                    AND h._raw:Country::VARCHAR = n._raw:Country::VARCHAR
                    AND h._time BETWEEN DATEADD('day', -30, n._time) AND DATEADD('minute', -240, CURRENT_TIMESTAMP()))

  - id: SFDC-005
    name: "Admin permissions granted"
    description: "Modify All Data / View All Data / System Administrator granted through a permission set or profile change."
    severity: 5
    tactic: "TA0004"
    technique: "T1098.003"
    table: "DATABASE_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "salesforce", "body": {"EventType": "SetupAuditTrail", "Username": "{{entity}}@corp.example", "SourceIp": "198.51.100.70", "OrganizationId": "00D1", "Action": "PermSetAssign", "Section": "Manage Users", "Display": "Permission set Super Admin: assigned to user eve (Modify All Data)"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "salesforce", "body": {"EventType": "SetupAuditTrail", "Username": "{{entity}}@corp.example", "SourceIp": "198.51.100.70", "OrganizationId": "00D1", "Action": "PermSetAssign", "Section": "Manage Users", "Display": "Permission set Sales Reports: assigned to user eve"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'Admin grant: ' || LEFT(COALESCE(query_text, ''), 200) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'salesforce' AND (action = 'setup' AND (query_text ILIKE '%Modify All Data%' OR query_text ILIKE '%View All Data%' OR query_text ILIKE '%System Administrator%' OR query_text ILIKE '%Author Apex%'))

