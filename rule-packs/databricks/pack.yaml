  - id: DBX-005
    name: "Secret harvesting"
    description: "Twenty or more getSecret calls by one user in 15 minutes."
    severity: 4
    tactic: "TA0006"
    technique: "T1552"
    table: "DATABASE_ACTIVITY"
    threshold: 20
    window_minutes: 15
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "databricks", "body": {"serviceName": "secrets", "actionName": "getSecret", "userIdentity": {"email": "{{entity}}@corp.example"}, "sourceIPAddress": "198.51.100.60", "userAgent": "databricks-cli", "requestParams": {"scope": "prod", "key": "db-pass"}, "response": {"statusCode": 200, "errorMessage": null}, "workspaceId": "1234567890", "accountId": "acc-1"}}, "count": 20, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "databricks", "body": {"serviceName": "secrets", "actionName": "getSecret", "userIdentity": {"email": "{{entity}}@corp.example"}, "sourceIPAddress": "198.51.100.60", "userAgent": "databricks-cli", "requestParams": {"scope": "prod", "key": "db-pass"}, "response": {"statusCode": 200, "errorMessage": null}, "workspaceId": "1234567890", "accountId": "acc-1"}}, "count": 3, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'getSecret ' || COALESCE(_raw:requestParams:key::VARCHAR, '') AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'databricks' AND (result = 'success' AND action = 'getSecret')

