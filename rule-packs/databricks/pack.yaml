# Generated by scripts/gen_rule_packs.py - edit there, then re-run it.
pack_id: databricks
name: Databricks Workspace Security
vendor: Databricks
version: 1
description: "Databricks audit-log detections: admin group changes, tokens, IP access lists, verbose audit logging, large result downloads, secret harvesting, login failures, broad Unity Catalog grants and Delta Sharing to new recipients."
requires: [{"table": "DATABASE_ACTIVITY", "vendor_product": "databricks"}]
onboarding: "Read system.access.audit (or audit log delivery) with otel-receiver/collector-examples/databricks_forwarder.py, service.name databricks."
rules:
  - id: DBX-001
    name: "User added to the admins group"
    description: "A principal was added to the workspace or account admins group."
    severity: 5
    tactic: "TA0004"
    technique: "T1098.003"
    table: "DATABASE_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "databricks", "body": {"serviceName": "groups", "actionName": "addPrincipalToGroup", "userIdentity": {"email": "{{entity}}@corp.example"}, "sourceIPAddress": "198.51.100.60", "userAgent": "databricks-cli", "requestParams": {"targetGroupName": "admins", "targetUserName": "eve"}, "response": {"statusCode": 200, "errorMessage": null}, "workspaceId": "1234567890", "accountId": "acc-1"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "databricks", "body": {"serviceName": "groups", "actionName": "addPrincipalToGroup", "userIdentity": {"email": "{{entity}}@corp.example"}, "sourceIPAddress": "198.51.100.60", "userAgent": "databricks-cli", "requestParams": {"targetGroupName": "analysts", "targetUserName": "eve"}, "response": {"statusCode": 200, "errorMessage": null}, "workspaceId": "1234567890", "accountId": "acc-1"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'Added to admins by ' || user_name || ': ' || LEFT(query_text, 150) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'databricks' AND (result = 'success' AND action = 'addPrincipalToGroup' AND (object ILIKE 'admins' OR query_text ILIKE '%"admins"%'))

  - id: DBX-002
    name: "Personal access token created"
    description: "PATs give long-lived API access and bypass SSO."
    severity: 3
    tactic: "TA0003"
    technique: "T1098.001"
    table: "DATABASE_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    false_positives: "Service principals for CI."
    fixtures: {"positive": [{"otel": {"service_name": "databricks", "body": {"serviceName": "accounts", "actionName": "generateDbToken", "userIdentity": {"email": "{{entity}}@corp.example"}, "sourceIPAddress": "198.51.100.60", "userAgent": "databricks-cli", "requestParams": {"lifetime_seconds": 0}, "response": {"statusCode": 200, "errorMessage": null}, "workspaceId": "1234567890", "accountId": "acc-1"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "databricks", "body": {"serviceName": "accounts", "actionName": "tokenLogin", "userIdentity": {"email": "{{entity}}@corp.example"}, "sourceIPAddress": "198.51.100.60", "userAgent": "databricks-cli", "requestParams": {}, "response": {"statusCode": 200, "errorMessage": null}, "workspaceId": "1234567890", "accountId": "acc-1"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'Token created: ' || query_type AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'databricks' AND (result = 'success' AND action IN ('generateDbToken', 'createToken', 'createOboToken'))

  - id: DBX-003
    name: "IP access lists disabled or removed"
    description: "Workspace IP access lists turned off or deleted."
    severity: 4
    tactic: "TA0005"
    technique: "T1562.007"
    table: "DATABASE_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "databricks", "body": {"serviceName": "workspace", "actionName": "workspaceConfEdit", "userIdentity": {"email": "{{entity}}@corp.example"}, "sourceIPAddress": "198.51.100.60", "userAgent": "databricks-cli", "requestParams": {"workspaceConfKeys": "enableIpAccessLists", "workspaceConfValues": "false"}, "response": {"statusCode": 200, "errorMessage": null}, "workspaceId": "1234567890", "accountId": "acc-1"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "databricks", "body": {"serviceName": "workspace", "actionName": "workspaceConfEdit", "userIdentity": {"email": "{{entity}}@corp.example"}, "sourceIPAddress": "198.51.100.60", "userAgent": "databricks-cli", "requestParams": {"workspaceConfKeys": "enableIpAccessLists", "workspaceConfValues": "true"}, "response": {"statusCode": 200, "errorMessage": null}, "workspaceId": "1234567890", "accountId": "acc-1"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, query_type || ': ' || LEFT(query_text, 150) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'databricks' AND (result = 'success' AND ((action = 'workspaceConfEdit' AND query_text ILIKE '%enableIpAccessLists%' AND query_text ILIKE '%false%') OR query_type ILIKE 'ipAccessLists.delete%'))

