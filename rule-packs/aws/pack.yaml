# Generated by scripts/gen_rule_packs.py - edit there, then re-run it.
pack_id: aws
name: AWS Account Security
vendor: AWS
version: 1
description: "CloudTrail detections for AWS: root use, logging and guardrail tampering, IAM persistence, public exposure of data, snapshot sharing, key destruction and cryptomining bursts."
requires: [{"table": "CLOUD_API", "vendor_product": "aws"}]
onboarding: "Ship CloudTrail through the OTel Collector (otel-receiver/collector-examples/cloudtrail.yaml, awss3 receiver) with service.name aws_cloudtrail."
rules:
  - id: AWS-001
    name: "Root account used"
    description: "Any API call or console sign-in by the root user."
    severity: 4
    tactic: "TA0004"
    technique: "T1078.004"
    table: "CLOUD_API"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    false_positives: "Break-glass procedures (should be rare and announced)."
    fixtures: {"positive": [{"otel": {"service_name": "aws_cloudtrail", "body": {"eventName": "ConsoleLogin", "eventSource": "signin.amazonaws.com", "userIdentity": {"type": "Root", "userName": "{{entity}}", "arn": "arn:aws:iam::111122223333:user/{{entity}}"}, "sourceIPAddress": "198.51.100.30", "awsRegion": "eu-west-1", "recipientAccountId": "111122223333", "requestParameters": {}}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "aws_cloudtrail", "body": {"eventName": "ConsoleLogin", "eventSource": "signin.amazonaws.com", "userIdentity": {"type": "IAMUser", "userName": "{{entity}}", "arn": "arn:aws:iam::111122223333:user/{{entity}}"}, "sourceIPAddress": "198.51.100.30", "awsRegion": "eu-west-1", "recipientAccountId": "111122223333", "requestParameters": {}}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'Root activity: ' || action || ' from ' || COALESCE(src, '?') AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.CLOUD_API
      WHERE vendor_product = 'aws' AND (user_type = 'Root')

