# Generated by scripts/gen_rule_packs.py - edit there, then re-run it.
pack_id: email
name: Email Security (Microsoft 365, Proofpoint)
vendor: Microsoft / Proofpoint
version: 1
description: "Mailbox takeover (external forwarding and inbox rules), permitted clicks on malicious URLs, malicious messages that were delivered, and phishing bursts."
requires: [{"table": "EMAIL_ACTIVITY", "vendor_product": "m365"}]
onboarding: "Run otel-receiver/collector-examples/m365_mail.py (message trace + Management Activity API) and proofpoint_tap.py (SIEM API)."
rules:
  - id: EM-001
    name: "Inbox rule forwards mail outside the company"
    description: "A user created or changed an inbox rule that forwards or redirects mail to an external address."
    severity: 4
    tactic: "TA0009"
    technique: "T1114.003"
    table: "EMAIL_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "m365_audit", "body": {"Operation": "New-InboxRule", "UserId": "{{entity}}@contoso.com", "ClientIP": "198.51.100.77:51000", "Workload": "Exchange", "ResultStatus": "True", "Parameters": [{"Name": "Name", "Value": "x"}, {"Name": "ForwardTo", "Value": "drop@evil.example"}]}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "m365_audit", "body": {"Operation": "New-InboxRule", "UserId": "{{entity}}@contoso.com", "ClientIP": "198.51.100.77:51000", "Workload": "Exchange", "ResultStatus": "True", "Parameters": [{"Name": "Name", "Value": "x"}, {"Name": "ForwardTo", "Value": "team@contoso.com"}]}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'forwards to ' || forward_to AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.EMAIL_ACTIVITY
      WHERE vendor_product = 'm365' AND (action = 'inbox_rule' AND forward_to IS NOT NULL AND SPLIT_PART(forward_to, '@', 2) <> dest)

  - id: EM-002
    name: "Mailbox forwarding set to an external address"
    description: "Set-Mailbox ForwardingSmtpAddress points the whole mailbox at an outside domain."
    severity: 4
    tactic: "TA0009"
    technique: "T1114.003"
    table: "EMAIL_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "m365_audit", "body": {"Operation": "Set-Mailbox", "UserId": "{{entity}}@contoso.com", "ClientIP": "198.51.100.77:51000", "Workload": "Exchange", "ResultStatus": "True", "Parameters": [{"Name": "ForwardingSmtpAddress", "Value": "smtp:drop@evil.example"}]}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "m365_audit", "body": {"Operation": "Set-Mailbox", "UserId": "{{entity}}@contoso.com", "ClientIP": "198.51.100.77:51000", "Workload": "Exchange", "ResultStatus": "True", "Parameters": [{"Name": "ForwardingSmtpAddress", "Value": "smtp:archive@contoso.com"}]}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'mailbox forwarding to ' || forward_to AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.EMAIL_ACTIVITY
      WHERE vendor_product = 'm365' AND (action = 'forwarding_set' AND forward_to IS NOT NULL AND SPLIT_PART(REPLACE(forward_to, 'smtp:', ''), '@', 2) <> dest)

  - id: EM-003
    name: "User clicked a malicious link that was allowed"
    description: "Proofpoint permitted a click on a URL it later classified as malicious or phishing."
    severity: 4
    tactic: "TA0001"
    technique: "T1204.001"
    table: "EMAIL_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "proofpoint", "body": {"_type": "clicksPermitted", "recipient": ["{{entity}}@contoso.com"], "sender": "billing@evil.example", "subject": "Overdue invoice", "messageID": "<p1@x>", "url": "http://203.0.113.5/inv.zip", "classification": "malware", "clickIP": "198.51.100.80", "threatID": "th1"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "proofpoint", "body": {"_type": "clicksPermitted", "recipient": ["{{entity}}@contoso.com"], "sender": "billing@evil.example", "subject": "Overdue invoice", "messageID": "<p1@x>", "url": "http://203.0.113.5/inv.zip", "classification": "spam", "clickIP": "198.51.100.80", "threatID": "th1"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'clicked ' || LEFT(url, 200) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.EMAIL_ACTIVITY
      WHERE vendor_product = 'proofpoint' AND (action = 'click' AND verdict IN ('malware', 'phish'))

  - id: EM-004
    name: "Malicious message delivered to a mailbox"
    description: "A message carrying a known malicious URL or attachment reached the inbox."
    severity: 3
    tactic: "TA0001"
    technique: "T1566.001"
    table: "EMAIL_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "proofpoint", "body": {"_type": "messagesDelivered", "recipient": ["{{entity}}@contoso.com"], "sender": "billing@evil.example", "subject": "Overdue invoice", "messageID": "<p1@x>", "fromAddress": ["billing@evil.example"], "senderIP": "203.0.113.20", "threatsInfoMap": [{"threat": "http://203.0.113.5/inv.zip", "classification": "malware", "threatID": "th1"}]}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "proofpoint", "body": {"_type": "messagesBlocked", "recipient": ["{{entity}}@contoso.com"], "sender": "billing@evil.example", "subject": "Overdue invoice", "messageID": "<p1@x>", "fromAddress": ["billing@evil.example"], "senderIP": "203.0.113.20", "threatsInfoMap": [{"threat": "http://203.0.113.5/inv.zip", "classification": "malware", "threatID": "th1"}]}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT _time, user_name, src, dest, 'delivered from ' || sender || ': ' || LEFT(subject, 120) AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.EMAIL_ACTIVITY
      WHERE vendor_product = 'proofpoint' AND (action = 'delivered' AND verdict IN ('malware', 'phish'))

  - id: EM-005
    name: "Phishing burst from one external sender"
    description: "One outside sender reached many inboxes in a short window."
    severity: 3
    tactic: "TA0001"
    technique: "T1566"
    table: "EMAIL_ACTIVITY"
    threshold: 1
    window_minutes: 60
    lookback_minutes: 240
    expected_latency_seconds: 600
    fixtures: {"positive": [{"otel": {"service_name": "m365_messagetrace", "body": {"SenderAddress": "hr-{{entity}}@evil.example", "RecipientAddress": "{{entity}}0@contoso.com", "Status": "Delivered", "Subject": "Invoice", "FromIP": "203.0.113.20", "MessageId": "<m1@x>", "Size": 2048, "Organization": "contoso.com"}}, "count": 1, "offset_minutes": 1}, {"otel": {"service_name": "m365_messagetrace", "body": {"SenderAddress": "hr-{{entity}}@evil.example", "RecipientAddress": "{{entity}}1@contoso.com", "Status": "Delivered", "Subject": "Invoice", "FromIP": "203.0.113.20", "MessageId": "<m1@x>", "Size": 2048, "Organization": "contoso.com"}}, "count": 1, "offset_minutes": 1}, {"otel": {"service_name": "m365_messagetrace", "body": {"SenderAddress": "hr-{{entity}}@evil.example", "RecipientAddress": "{{entity}}2@contoso.com", "Status": "Delivered", "Subject": "Invoice", "FromIP": "203.0.113.20", "MessageId": "<m1@x>", "Size": 2048, "Organization": "contoso.com"}}, "count": 1, "offset_minutes": 1}, {"otel": {"service_name": "m365_messagetrace", "body": {"SenderAddress": "hr-{{entity}}@evil.example", "RecipientAddress": "{{entity}}3@contoso.com", "Status": "Delivered", "Subject": "Invoice", "FromIP": "203.0.113.20", "MessageId": "<m1@x>", "Size": 2048, "Organization": "contoso.com"}}, "count": 1, "offset_minutes": 1}, {"otel": {"service_name": "m365_messagetrace", "body": {"SenderAddress": "hr-{{entity}}@evil.example", "RecipientAddress": "{{entity}}4@contoso.com", "Status": "Delivered", "Subject": "Invoice", "FromIP": "203.0.113.20", "MessageId": "<m1@x>", "Size": 2048, "Organization": "contoso.com"}}, "count": 1, "offset_minutes": 1}, {"otel": {"service_name": "m365_messagetrace", "body": {"SenderAddress": "hr-{{entity}}@evil.example", "RecipientAddress": "{{entity}}5@contoso.com", "Status": "Delivered", "Subject": "Invoice", "FromIP": "203.0.113.20", "MessageId": "<m1@x>", "Size": 2048, "Organization": "contoso.com"}}, "count": 1, "offset_minutes": 1}, {"otel": {"service_name": "m365_messagetrace", "body": {"SenderAddress": "hr-{{entity}}@evil.example", "RecipientAddress": "{{entity}}6@contoso.com", "Status": "Delivered", "Subject": "Invoice", "FromIP": "203.0.113.20", "MessageId": "<m1@x>", "Size": 2048, "Organization": "contoso.com"}}, "count": 1, "offset_minutes": 1}, {"otel": {"service_name": "m365_messagetrace", "body": {"SenderAddress": "hr-{{entity}}@evil.example", "RecipientAddress": "{{entity}}7@contoso.com", "Status": "Delivered", "Subject": "Invoice", "FromIP": "203.0.113.20", "MessageId": "<m1@x>", "Size": 2048, "Organization": "contoso.com"}}, "count": 1, "offset_minutes": 1}, {"otel": {"service_name": "m365_messagetrace", "body": {"SenderAddress": "hr-{{entity}}@evil.example", "RecipientAddress": "{{entity}}8@contoso.com", "Status": "Delivered", "Subject": "Invoice", "FromIP": "203.0.113.20", "MessageId": "<m1@x>", "Size": 2048, "Organization": "contoso.com"}}, "count": 1, "offset_minutes": 1}, {"otel": {"service_name": "m365_messagetrace", "body": {"SenderAddress": "hr-{{entity}}@evil.example", "RecipientAddress": "{{entity}}9@contoso.com", "Status": "Delivered", "Subject": "Invoice", "FromIP": "203.0.113.20", "MessageId": "<m1@x>", "Size": 2048, "Organization": "contoso.com"}}, "count": 1, "offset_minutes": 1}, {"otel": {"service_name": "m365_messagetrace", "body": {"SenderAddress": "hr-{{entity}}@evil.example", "RecipientAddress": "{{entity}}10@contoso.com", "Status": "Delivered", "Subject": "Invoice", "FromIP": "203.0.113.20", "MessageId": "<m1@x>", "Size": 2048, "Organization": "contoso.com"}}, "count": 1, "offset_minutes": 1}, {"otel": {"service_name": "m365_messagetrace", "body": {"SenderAddress": "hr-{{entity}}@evil.example", "RecipientAddress": "{{entity}}11@contoso.com", "Status": "Delivered", "Subject": "Invoice", "FromIP": "203.0.113.20", "MessageId": "<m1@x>", "Size": 2048, "Organization": "contoso.com"}}, "count": 1, "offset_minutes": 1}], "negative": [{"otel": {"service_name": "m365_messagetrace", "body": {"SenderAddress": "hr-{{entity}}@evil.example", "RecipientAddress": "{{entity}}0@contoso.com", "Status": "Delivered", "Subject": "Invoice", "FromIP": "203.0.113.20", "MessageId": "<m1@x>", "Size": 2048, "Organization": "contoso.com"}}, "count": 1, "offset_minutes": 1}]}
    sql: |
      SELECT MAX(_time) AS _time, MIN(user_name) AS user_name, ANY_VALUE(src) AS src, sender AS dest,
             sender || ' mailed ' || COUNT(DISTINCT recipient) || ' recipients' AS description
      FROM SNOWFLAKE_XDR.RAW_LOGS.EMAIL_ACTIVITY
      WHERE vendor_product = 'm365' AND direction = 'inbound' AND action = 'delivered'
      GROUP BY sender, TIME_SLICE(_time::TIMESTAMP_NTZ, 15, 'MINUTE')
      HAVING COUNT(DISTINCT recipient) >= 10

